<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Agent 配置</title>
    <script type="module" src="/static/agent.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font:
          14px/1.7 system-ui,
          "Microsoft YaHei",
          sans-serif;
        color: #344439;
        background: #f6f7f2;
      }
      main {
        max-width: 1000px;
        margin: auto;
        padding: 20px;
      }
      section {
        border: 1px solid #dfe5db;
        background: white;
        padding: 24px;
        border-radius: 12px;
        margin-bottom: 20px;
      }
      h2 {
        margin: 0 0 12px;
        font-size: 19px;
      }
      p,
      small {
        color: #667368;
      }
      label {
        display: block;
        font-weight: 600;
        margin: 14px 0 6px;
      }
      input,
      select,
      textarea,
      button {
        font: inherit;
        border: 1px solid #ced9cc;
        border-radius: 7px;
        padding: 10px;
        max-width: 100%;
        color: inherit;
        background: white;
      }
      input:not([type="checkbox"]),
      select,
      textarea {
        width: 100%;
      }
      input[type="checkbox"] {
        width: 18px;
        height: 18px;
        accent-color: #266a4d;
        vertical-align: middle;
      }
      textarea {
        min-height: 110px;
        resize: vertical;
      }
      button {
        cursor: pointer;
        min-height: 44px;
      }
      button:disabled {
        opacity: 0.5;
        cursor: wait;
      }
      button.primary {
        background: #266a4d;
        color: white;
        border-color: #266a4d;
      }
      .row {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        align-items: center;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px 20px;
      }
      header {
        position: sticky;
        top: 0;
        background: #f6f7f2;
        padding: 12px 0;
        z-index: 2;
      }
      #state {
        flex: 1;
        color: #536b59;
      }
      pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        max-height: 300px;
        overflow: auto;
        font-size: 12px;
      }
      #result {
        background: #f2f5ee;
        padding: 16px;
        border-radius: 8px;
      }
      small {
        display: block;
      }
      details {
        margin: 12px 0;
      }
      summary {
        cursor: pointer;
      }
      @media (max-width: 600px) {
        main {
          padding: 12px;
        }
        section {
          padding: 16px;
        }
        .grid {
          grid-template-columns: 1fr;
        }
        input,
        select,
        textarea {
          font-size: 16px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header class="row">
        <strong id="state" role="status">正在加载…</strong
        ><button id="reload">重新加载</button
        ><button id="save" class="primary">保存 Agent 配置</button>
      </header>
      <section>
        <h2>工作台与执行预算</h2>
        <label><input id="enabled" type="checkbox" /> 开启 Agent 工作台</label>
        <p>
          预算用于控制单轮成本与循环次数；达到上限会保存已有内容，等待用户继续，不截断已有记录。
        </p>
        <div class="grid">
          <label
            >每轮最多步骤<input
              id="max_steps"
              type="number"
              min="2"
              max="100" /></label
          ><label
            >每轮 token 预算<input
              id="max_tokens"
              type="number"
              min="4096"
              max="1500000" /></label
          ><label
            >单次输出 token 上限<input
              id="output_tokens"
              type="number"
              min="2048"
              max="131072" /></label
          ><label
            >每轮最长秒数<input
              id="max_seconds"
              type="number"
              min="60"
              max="7200" /></label
          ><label
            >执行并发数<input id="concurrency" type="number" min="1" max="8"
          /></label>
        </div>
      </section>
      <section>
        <h2>网页搜索 MCP</h2>
        <p>
          管理员配置真实服务。用户端仅显示“网页搜索”开关；连接地址、令牌和固定参数不会发送给用户或模型。
        </p>
        <label
          ><input id="mcp_enabled" type="checkbox" /> 对用户提供网页搜索</label
        ><label for="mcp_url">MCP 地址 · Streamable HTTP</label
        ><input
          id="mcp_url"
          type="url"
          placeholder="https://your-service.example/mcp"
          autocomplete="off"
        /><small
          >支持 HTTP JSON / SSE 响应。不支持本地 stdio 或旧版独立 SSE
          端点。</small
        ><label for="mcp_token">Bearer 令牌</label
        ><input
          id="mcp_token"
          type="password"
          autocomplete="new-password"
        /><small id="token-state"></small
        ><label><input type="checkbox" id="clear_token" /> 清除已保存令牌</label
        ><label for="mcp_timeout">单次请求超时（秒）</label
        ><input id="mcp_timeout" type="number" min="5" max="180" />
        <div class="row"><button id="connect">测试连接并读取工具</button></div>
        <label for="mcp_tool">选择用于网页搜索的工具</label
        ><select id="mcp_tool"></select>
        <p id="tool-description"></p>
        <label for="mcp_query_field">查询文本对应的参数字段</label
        ><input id="mcp_query_field" placeholder="query" /><label
          for="mcp_arguments"
          >固定参数（JSON 对象）</label
        ><textarea
          id="mcp_arguments"
          spellcheck="false"
          placeholder='{"max_results": 5}'
        ></textarea>
        <details>
          <summary>所选工具的参数定义</summary>
          <pre id="schema"></pre>
        </details>
        <label for="query">实际试搜</label
        ><input id="query" value="高考英语 阅读理解" />
        <div class="row">
          <button id="search">试运行搜索（使用当前表单）</button>
        </div>
        <pre id="result" hidden></pre>
      </section>
    </main>
  </body>
</html>
