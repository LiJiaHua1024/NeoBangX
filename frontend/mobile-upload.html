<!DOCTYPE html>
<html lang="zh-CN" data-theme="paper">
<head>
<meta charset="utf-8">
<!-- 手机端固定宽高比渲染：拍照页在横竖屏切换时不做花哨适配，只保证不缩放错位 -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" id="theme-color" content="#f3f0e9">
<title>拍照上传 · NeoBangX</title>
<style>
  /* ============================================================
     设计令牌：与主站 frontend/styles.css 同源，只取这个页面用得到的那些。
     改配色请与 styles.css 里对应的主题块一起改，两边别走散。
     主题由电脑端在建配对会话时给过来（见页尾 setTheme），
     手机页跟着电脑当前的配色渲染，不另起一套。
     ============================================================ */
  :root {
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text",
      "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei UI", "Microsoft YaHei",
      "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    --ease-spring: cubic-bezier(0.34, 1.45, 0.64, 1);
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    /* 液态玻璃（Liquid Glass）配方：浅色主题轻度模糊，深色主题在下方覆盖回较强模糊 */
    --glass-blur: 3px;
    --glass-blur-soft: 2px;
    --glass-sat: 150%;
    --glass-contrast: 104%;
  }
  html[data-theme="obsidian"],
  html[data-theme="jade"],
  html[data-theme="sora"][data-sky="night"] {
    --glass-blur: 14px;
    --glass-blur-soft: 10px;
  }

  /* 曜石：熔金暗色 */
  html[data-theme="obsidian"] {
    color-scheme: dark;
    --bg: #0c0b0e;
    --accent: #e9a15b;
    --accent-2: #cf7038;
    --title-grad: linear-gradient(112deg, #f4e3c2 0%, var(--accent) 55%, var(--accent-2) 100%);
    --text: #edece7;
    --text-dim: #9b978c;
    --text-faint: #63605a;
    --glass-spec: #f7e7cd;
    --panel: color-mix(in srgb, var(--accent) 6%, transparent);
    --panel-soft: color-mix(in srgb, var(--accent) 4%, transparent);
    --panel-strong: color-mix(in srgb, #16100c 68%, transparent);
    --border: rgba(255, 255, 255, 0.075);
    --border-strong: rgba(255, 255, 255, 0.14);
    --hover-bg: rgba(255, 255, 255, 0.07);
    --active-bg: color-mix(in srgb, var(--accent) 12%, transparent);
    --btn-bg: #ede9e0;
    --btn-text: #17130d;
    --btn-hover: #ffffff;
    --shadow: 0 20px 55px -14px rgba(0, 0, 0, 0.6);
    --glow: rgba(233, 161, 91, 0.28);
    --ok-text: #7fd8a8;
    --danger-text: #f0958a;
  }

  /* 宣纸：暖米纸感（手机页默认，与主站默认主题一致） */
  html[data-theme="paper"] {
    color-scheme: light;
    --bg: #f3f0e9;
    --accent: #b4502a;
    --accent-2: #8c3316;
    --title-grad: linear-gradient(112deg, #d97b4a 0%, var(--accent) 55%, var(--accent-2) 100%);
    --text: #1d1a15;
    --text-dim: #6f675a;
    --text-faint: #a29a8b;
    --glass-spec: #fffdf8;
    --panel: color-mix(in srgb, var(--glass-spec) 14%, transparent);
    --panel-soft: color-mix(in srgb, var(--glass-spec) 10%, transparent);
    --panel-strong: color-mix(in srgb, var(--glass-spec) 82%, var(--text) 5%);
    --border: rgba(29, 26, 21, 0.08);
    --border-strong: rgba(29, 26, 21, 0.15);
    --hover-bg: rgba(255, 255, 255, 0.72);
    --active-bg: color-mix(in srgb, var(--accent) 9%, transparent);
    --btn-bg: #1d1a15;
    --btn-text: #f5f2ea;
    --btn-hover: #000000;
    --shadow: 0 18px 50px -18px rgba(80, 60, 30, 0.28);
    --glow: rgba(180, 80, 42, 0.2);
    --ok-text: #0f7355;
    --danger-text: #b03a28;
  }

  /* 青瓷：冷青浅色 */
  html[data-theme="celadon"] {
    color-scheme: light;
    --bg: #ecf1ee;
    --accent: #0e6e5f;
    --accent-2: #0a5245;
    --title-grad: linear-gradient(112deg, #2f9c83 0%, var(--accent) 55%, var(--accent-2) 100%);
    --text: #15211c;
    --text-dim: #5d6e66;
    --text-faint: #93a39b;
    --glass-spec: #eaf7f1;
    --panel: color-mix(in srgb, var(--glass-spec) 14%, transparent);
    --panel-soft: color-mix(in srgb, var(--glass-spec) 10%, transparent);
    --panel-strong: color-mix(in srgb, var(--glass-spec) 82%, var(--text) 5%);
    --border: rgba(21, 33, 28, 0.08);
    --border-strong: rgba(21, 33, 28, 0.15);
    --hover-bg: rgba(255, 255, 255, 0.72);
    --active-bg: color-mix(in srgb, var(--accent) 9%, transparent);
    --btn-bg: #15211c;
    --btn-text: #edf4f0;
    --btn-hover: #000000;
    --shadow: 0 18px 50px -18px rgba(20, 70, 58, 0.25);
    --glow: rgba(14, 110, 95, 0.2);
    --ok-text: #0b6b53;
    --danger-text: #b03a28;
  }

  /* 墨翠：深绿玉石 */
  html[data-theme="jade"] {
    color-scheme: dark;
    --bg: #0a0f0c;
    --accent: #5cb787;
    --accent-2: #2f8a66;
    --title-grad: linear-gradient(112deg, #c2ecd2 0%, var(--accent) 55%, var(--accent-2) 100%);
    --text: #e4eee7;
    --text-dim: #7f948a;
    --text-faint: #557064;
    --glass-spec: #d8f2e2;
    --panel: color-mix(in srgb, var(--accent) 6%, transparent);
    --panel-soft: color-mix(in srgb, var(--accent) 4%, transparent);
    --panel-strong: color-mix(in srgb, #0e1a13 68%, transparent);
    --border: rgba(255, 255, 255, 0.07);
    --border-strong: rgba(255, 255, 255, 0.13);
    --hover-bg: rgba(255, 255, 255, 0.065);
    --active-bg: color-mix(in srgb, var(--accent) 12%, transparent);
    --btn-bg: #e6efe8;
    --btn-text: #0e1712;
    --btn-hover: #ffffff;
    --shadow: 0 20px 55px -14px rgba(0, 0, 0, 0.6);
    --glow: rgba(92, 183, 135, 0.24);
    --ok-text: #7fd8a8;
    --danger-text: #f0958a;
  }

  /* 悠空：天空随电脑端传进来的时段（day / night）切换；不带云与飞鸟的动画 */
  html[data-theme="sora"] {
    color-scheme: light;
    --bg: #e9f0f7;
    --bg-grad:
      radial-gradient(circle 3rem at 80% 12%, rgba(255, 253, 242, 0.95) 0%, rgba(255, 253, 242, 0.5) 40%, rgba(255, 253, 242, 0) 72%),
      radial-gradient(circle 13rem at 80% 12%, rgba(255, 238, 190, 0.4) 0%, rgba(255, 238, 190, 0.15) 42%, rgba(255, 238, 190, 0) 72%),
      radial-gradient(circle 46rem at 12% 112%,
        rgba(0, 0, 0, 0) 62%, rgba(255, 120, 120, 0.1) 63%, rgba(255, 200, 110, 0.1) 64.5%,
        rgba(255, 255, 150, 0.1) 66%, rgba(140, 220, 160, 0.1) 67.5%, rgba(140, 180, 255, 0.1) 69%,
        rgba(190, 150, 255, 0.1) 70.5%, rgba(0, 0, 0, 0) 72%),
      radial-gradient(ellipse 34% 13% at 12% 103%, rgba(255, 255, 255, 0.85) 0%, rgba(255, 255, 255, 0) 70%),
      radial-gradient(ellipse 42% 15% at 48% 106%, rgba(255, 255, 255, 0.9) 0%, rgba(255, 255, 255, 0) 70%),
      radial-gradient(ellipse 30% 12% at 84% 104%, rgba(255, 255, 255, 0.8) 0%, rgba(255, 255, 255, 0) 70%),
      linear-gradient(180deg, #d3e2f1 0%, #e6eef7 45%, #f7fbfe 100%);
    --accent: #4f8cc4;
    --accent-2: #35709f;
    --title-grad: linear-gradient(112deg, #9cc4e6 0%, var(--accent) 55%, var(--accent-2) 100%);
    --text: #1d2733;
    --text-dim: #5c6d7f;
    --text-faint: #93a3b3;
    --glass-spec: #f2f8ff;
    --panel: color-mix(in srgb, var(--glass-spec) 13%, transparent);
    --panel-soft: color-mix(in srgb, var(--glass-spec) 9%, transparent);
    --panel-strong: color-mix(in srgb, var(--glass-spec) 80%, var(--text) 4%);
    --border: rgba(45, 75, 105, 0.1);
    --border-strong: rgba(45, 75, 105, 0.18);
    --hover-bg: rgba(255, 255, 255, 0.6);
    --active-bg: color-mix(in srgb, var(--accent) 10%, transparent);
    --btn-bg: #2c3e52;
    --btn-text: #eef6fc;
    --btn-hover: #1d2b3b;
    --shadow: 0 18px 50px -18px rgba(60, 100, 140, 0.25);
    --glow: rgba(79, 140, 196, 0.22);
    --ok-text: #1f7a5a;
    --danger-text: #b03a28;
  }
  html[data-theme="sora"][data-sky="night"] {
    color-scheme: dark;
    --bg: #111c33;
    --bg-grad:
      radial-gradient(circle 3.2rem at 82% 14%, rgba(246, 248, 252, 0.92) 0%, rgba(246, 248, 252, 0.42) 40%, rgba(246, 248, 252, 0) 72%),
      radial-gradient(circle 11rem at 82% 14%, rgba(190, 214, 246, 0.34) 0%, rgba(190, 214, 246, 0.13) 42%, rgba(190, 214, 246, 0) 70%),
      radial-gradient(ellipse 36% 13% at 16% 104%, rgba(18, 32, 60, 0.92) 0%, rgba(18, 32, 60, 0) 70%),
      radial-gradient(ellipse 44% 15% at 55% 107%, rgba(22, 38, 68, 0.92) 0%, rgba(22, 38, 68, 0) 70%),
      radial-gradient(ellipse 30% 12% at 88% 105%, rgba(20, 34, 62, 0.88) 0%, rgba(20, 34, 62, 0) 70%),
      linear-gradient(180deg, #0d1830 0%, #152442 55%, #1d3054 100%);
    --accent: #8fb6e6;
    --accent-2: #5d86c2;
    --title-grad: linear-gradient(112deg, #dcebff 0%, var(--accent) 55%, var(--accent-2) 100%);
    --text: #e3ecf7;
    --text-dim: #8ba0b8;
    --text-faint: #5b6f85;
    --glass-spec: #cfe0ff;
    --panel: color-mix(in srgb, var(--accent) 7%, transparent);
    --panel-soft: color-mix(in srgb, var(--accent) 4.5%, transparent);
    --panel-strong: color-mix(in srgb, #0e1a30 70%, transparent);
    --border: rgba(180, 210, 255, 0.11);
    --border-strong: rgba(180, 210, 255, 0.18);
    --hover-bg: rgba(180, 210, 255, 0.09);
    --active-bg: color-mix(in srgb, var(--accent) 12%, transparent);
    --btn-bg: #dceafb;
    --btn-text: #101a2c;
    --btn-hover: #ffffff;
    --shadow: 0 20px 55px -14px rgba(0, 0, 0, 0.6);
    --glow: rgba(143, 182, 230, 0.25);
    --ok-text: #7fd8a8;
    --danger-text: #f0958a;
  }

  /* ============================================================
     液态玻璃表面：与主站 .glass / .glass-soft 同一配方
     ============================================================ */
  .glass {
    background:
      linear-gradient(180deg,
        color-mix(in srgb, var(--glass-spec) 22%, transparent) 0%,
        color-mix(in srgb, var(--glass-spec) 0%, transparent) 20%),
      radial-gradient(140% 80% at 50% -14%,
        color-mix(in srgb, var(--glass-spec) 16%, transparent),
        transparent 58%),
      var(--panel);
    border: 1px solid var(--border);
    backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat)) contrast(var(--glass-contrast));
    -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat)) contrast(var(--glass-contrast));
    box-shadow:
      inset 0 1px 0 color-mix(in srgb, var(--glass-spec) 40%, transparent),
      inset 0 -1px 0 color-mix(in srgb, var(--glass-spec) 10%, transparent),
      var(--shadow);
    transition: background 0.6s ease, border-color 0.6s ease;
  }
  .glass-soft {
    background:
      linear-gradient(180deg,
        color-mix(in srgb, var(--glass-spec) 16%, transparent) 0%,
        color-mix(in srgb, var(--glass-spec) 0%, transparent) 18%),
      radial-gradient(140% 80% at 50% -14%,
        color-mix(in srgb, var(--glass-spec) 12%, transparent),
        transparent 58%),
      var(--panel-soft);
    border: 1px solid var(--border);
    backdrop-filter: blur(var(--glass-blur-soft)) saturate(var(--glass-sat)) contrast(var(--glass-contrast));
    -webkit-backdrop-filter: blur(var(--glass-blur-soft)) saturate(var(--glass-sat)) contrast(var(--glass-contrast));
    box-shadow:
      inset 0 1px 0 color-mix(in srgb, var(--glass-spec) 32%, transparent),
      inset 0 -1px 0 color-mix(in srgb, var(--glass-spec) 8%, transparent);
    transition: background 0.6s ease, border-color 0.6s ease, box-shadow 0.3s ease;
  }

  /* ============================================================
     基础版式
     ============================================================ */
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { min-height: 100%; }
  body {
    margin: 0;
    min-height: 100%;
    font-family: var(--font);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%;
    /* 主题底色 + 一层静止的环境光晕（主站那层会呼吸的光，这里定格），
       让上面的玻璃面板有东西可以折射；悠空自带天空渐变，盖在最上面 */
    background-color: var(--bg);
    background-image:
      var(--bg-grad, none),
      radial-gradient(58% 38% at 82% 2%, var(--glow), transparent 70%),
      radial-gradient(52% 34% at 8% 98%, var(--glow), transparent 74%);
    padding: env(safe-area-inset-top) 1rem calc(1.5rem + env(safe-area-inset-bottom));
    transition: background-color 0.6s ease, color 0.6s ease;
  }
  ::selection { background: color-mix(in srgb, var(--accent) 32%, transparent); color: var(--text); }
  :focus-visible { outline: 2px solid color-mix(in srgb, var(--accent) 65%, transparent); outline-offset: 2px; }

  .wrap { max-width: 30rem; margin: 0 auto; display: flex; flex-direction: column; gap: 0.75rem; }
  header { padding: 1.4rem 0.15rem 0.4rem; }
  h1 {
    font-size: 1.2rem; font-weight: 750; letter-spacing: 0.01em; margin: 0 0 0.4rem;
    background: var(--title-grad);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .sub { font-size: 0.82rem; line-height: 1.7; color: var(--text-dim); margin: 0; }
  .note { font-size: 0.78rem; line-height: 1.7; color: var(--text-faint); margin: 0.75rem 0 0; }
  .err { color: var(--danger-text); font-size: 0.85rem; line-height: 1.7; margin: 0 0 0.4rem; }
  .ok { color: var(--ok-text); font-size: 0.88rem; font-weight: 650; margin: 0; }

  .card { border-radius: 1.2rem; padding: 1rem; position: relative; }
  .stack { display: flex; flex-direction: column; gap: 0.6rem; }

  /* 上传来源：与电脑端弹窗里那两条大选项行同款（.upl-opt），一眼是同一套东西 */
  .opts { display: flex; flex-direction: column; gap: 0.5rem; }
  .opt {
    display: flex; align-items: center; gap: 0.75rem;
    width: 100%; text-align: left; cursor: pointer; font-family: var(--font);
    padding: 0.85rem 1rem; min-height: 3.6rem;
    border-radius: 1rem;
    border: 1px solid var(--border);
    background: var(--panel-soft);
    color: var(--text);
    transition: border-color 0.2s ease, background 0.2s ease, transform 0.18s var(--ease-out);
  }
  .opt:active:not(:disabled) { transform: scale(0.99); background: var(--hover-bg); }
  .opt:disabled { opacity: 0.5; cursor: not-allowed; }
  .opt-ico {
    flex: 0 0 auto; width: 2.5rem; height: 2.5rem; border-radius: 0.8rem;
    display: flex; align-items: center; justify-content: center;
    background: color-mix(in srgb, var(--accent) 12%, transparent);
    color: var(--accent);
  }
  .opt-ico svg { width: 1.35rem; height: 1.35rem; }
  .opt-text { display: flex; flex-direction: column; gap: 0.15rem; min-width: 0; }
  .opt-text b { font-size: 0.92rem; font-weight: 650; }
  .opt-text i { font-style: normal; font-size: 0.78rem; color: var(--text-dim); }

  /* 按钮：阴阳实心（主操作）+ 玻璃幽灵（次要），形状与按压回缩沿用主站 */
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 0.5rem;
    width: 100%; min-height: 3rem; padding: 0.6rem 1.2rem;
    border-radius: 0.8rem; cursor: pointer;
    font-family: var(--font); font-size: 0.9rem; font-weight: 600; letter-spacing: 0.01em;
    color: var(--text);
    background: var(--panel-soft);
    border: 1px solid var(--border);
    backdrop-filter: blur(var(--glass-blur-soft)) saturate(var(--glass-sat));
    -webkit-backdrop-filter: blur(var(--glass-blur-soft)) saturate(var(--glass-sat));
    box-shadow: inset 0 1px 0 color-mix(in srgb, var(--glass-spec) 8%, transparent);
    transition: background 0.2s ease, transform 0.4s var(--ease-spring), opacity 0.2s ease;
  }
  .btn:active:not(:disabled) { transform: scale(0.95); background: var(--hover-bg); transition-duration: 0.08s; }
  .btn.primary {
    color: var(--btn-text);
    background: var(--btn-bg);
    border-color: color-mix(in srgb, var(--btn-bg) 88%, var(--text));
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12), 0 8px 24px -10px rgba(0, 0, 0, 0.35);
  }
  .btn.primary:active:not(:disabled) { background: var(--btn-hover); }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }

  .meta {
    display: flex; align-items: center; justify-content: space-between; gap: 0.5rem;
    margin-top: 0.9rem; font-size: 0.8rem; color: var(--text-dim);
  }
  .meta span:last-child { color: var(--text-faint); }
  .bar { height: 4px; margin-top: 0.4rem; border-radius: 999px; background: var(--border); overflow: hidden; }
  .bar > i {
    display: block; height: 100%; width: 0;
    background: linear-gradient(90deg, var(--accent-2), var(--accent));
    transition: width 0.2s ease;
  }

  .shots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; }
  .shot {
    position: relative; aspect-ratio: 3 / 4; overflow: hidden;
    border-radius: 0.7rem; border: 1px solid var(--border-strong);
    background: color-mix(in srgb, var(--bg) 40%, transparent);
  }
  .shot img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .shot b {
    position: absolute; left: 0.25rem; bottom: 0.25rem;
    font-size: 0.68rem; font-weight: 650; padding: 0.05rem 0.4rem; border-radius: 999px;
    color: var(--accent);
    background: color-mix(in srgb, var(--bg) 78%, transparent);
    border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
  }
  .shot.failed b { color: var(--danger-text); border-color: color-mix(in srgb, var(--danger-text) 45%, transparent); }
  .shot.sending b { color: var(--text-dim); border-color: var(--border-strong); }

  .hidden { display: none !important; }
  .center { text-align: center; }
</style>
<script>
/* 首屏定色：主题写在网址里（电脑端建会话时就附在 path 上），
   在 body 出现之前把 data-theme 落好，免得先闪一下默认配色再变色。
   /hello 回来后还会用会话里的权威值再对一次（手输网址、或主题变了时兜底）。 */
(function () {
  "use strict";
  var THEMES = ["paper", "celadon", "obsidian", "jade", "sora"];
  var BASE_COLORS = { paper: "#f3f0e9", celadon: "#ecf1ee", obsidian: "#0c0b0e", jade: "#0a0f0c" };
  var SKY_COLORS = { day: "#d3e2f1", night: "#0d1830" };

  function hourSky() {
    var h = new Date().getHours();
    return h >= 6 && h < 22 ? "day" : "night";
  }

  /* theme / sky -> 页面配色；未知值退回默认主题，绝不把用户串当主题用 */
  window.nbxSetTheme = function (theme, sky) {
    var t = String(theme || "").toLowerCase();
    if (THEMES.indexOf(t) < 0) t = "paper";
    var de = document.documentElement;
    de.setAttribute("data-theme", t);
    var color = BASE_COLORS[t];
    if (t === "sora") {
      var s = sky === "day" || sky === "night" ? sky : hourSky();
      de.setAttribute("data-sky", s);
      color = SKY_COLORS[s];
    } else {
      de.removeAttribute("data-sky");
    }
    var meta = document.getElementById("theme-color");
    if (meta && color) meta.setAttribute("content", color);
    return t;
  };

  var q = new URLSearchParams(location.search);
  window.nbxSetTheme(q.get("theme"), q.get("sky"));
})();
</script>
</head>
<body>
<div class="wrap">
  <header>
    <h1>拍照上传</h1>
    <p class="sub" id="sub">照片直接上传到服务器，电脑端会实时收到。排序、选择与识别都在电脑上操作。</p>
  </header>

  <!-- 初始化/校验中 -->
  <section class="card glass center" id="loading">
    <p class="sub" style="margin:0">正在校验配对…</p>
  </section>

  <!-- 配对失效 -->
  <section class="card glass hidden" id="invalid">
    <p class="err" id="invalid-msg">配对已失效或已过期。</p>
    <p class="note">请在电脑端重新生成二维码后扫描。</p>
  </section>

  <!-- 主流程：两个大选项，与电脑端上传弹窗里的那两条一致 -->
  <section class="card glass hidden" id="main">
    <div class="opts">
      <button type="button" class="opt" id="btn-camera">
        <span class="opt-ico">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 9A2.5 2.5 0 0 1 6 6.5h1a1.6 1.6 0 0 0 1.4-.8l.5-.9a1.6 1.6 0 0 1 1.4-.8h3.4a1.6 1.6 0 0 1 1.4.8l.5.9a1.6 1.6 0 0 0 1.4.8h1A2.5 2.5 0 0 1 20.5 9v7A2.5 2.5 0 0 1 18 18.5H6A2.5 2.5 0 0 1 3.5 16Z"/><circle cx="12" cy="12.5" r="3.2"/></svg>
        </span>
        <span class="opt-text"><b>拍照</b><i>调用摄像头拍摄</i></span>
      </button>
      <button type="button" class="opt" id="btn-album">
        <span class="opt-ico">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="15" rx="2.5"/><circle cx="8.6" cy="10" r="1.5"/><path d="m4 17.2 4.3-4a2 2 0 0 1 2.7 0l3.4 3.2"/><path d="m13.6 15.2 1.5-1.4a2 2 0 0 1 2.7 0l2.2 2"/></svg>
        </span>
        <span class="opt-text"><b>从相册选择</b><i>从相册中选取，可多张</i></span>
      </button>
    </div>
    <div class="meta">
      <span id="count">还没有照片</span>
      <span id="limit"></span>
    </div>
    <div class="bar"><i id="bar"></i></div>
    <p class="note">一次最多 <span id="max">8</span> 张。</p>
  </section>

  <!-- 已拍列表：每张的状态就是它自己的上传结果 -->
  <section class="card glass hidden" id="shots-card">
    <div class="shots" id="shots"></div>
    <div class="stack" style="margin-top:0.9rem">
      <button type="button" class="btn" id="btn-retry">重试未传成功的</button>
      <button type="button" class="btn" id="btn-clear">清空本页列表</button>
    </div>
  </section>

  <p class="note hidden center" id="uploading" style="margin:0">正在上传，请勿关闭本页…</p>
  <p class="ok hidden center" id="sent" style="margin:0">✓ 已经在电脑上了，回到电脑继续</p>

  <input type="file" id="input-camera" accept="image/*" capture="environment" class="hidden">
  <input type="file" id="input-album" accept="image/*" multiple class="hidden">
</div>

<script>
/* 手机拍照上传页（免登录，token 即凭证）。
   这个页面只做两件事：拍（或选）照片、把每张压好直传服务器。
   排序、删除、选识别类型、开始识别都在电脑上——手机不参与决策，也不该替用户按下任何「开始」。

   配色跟着电脑走（nbxSetTheme）：/hello 回来后用会话里的主题再定一次色，
   手机上是电脑正开着的那套皮，不是自己另起一套。

   与主站 index.html 的图片压缩参数保持一致：长边 2000 / JPEG 0.85 —— 上游视觉模型会把图
   缩到 1–2k 像素级，传更大的图只是白占带宽，而这个页面常常跑在手机流量上。 */
(function () {
  "use strict";

  var MAX_IMAGES = 8;
  var MAX_EDGE = 2000;
  var QUALITY = 0.85;
  var params = new URLSearchParams(location.search);
  var token = (params.get("token") || "").trim();

  var el = function (id) { return document.getElementById(id); };
  var shots = [];     // { dataUrl, blob, state: "sending" | "sent" | "failed" }
  var busy = false;

  function show(id, on) {
    el(id).classList.toggle("hidden", !on);
  }

  function fail(message) {
    el("invalid-msg").textContent = message || "配对已失效或已过期。";
    show("loading", false);
    show("main", false);
    show("shots-card", false);
    show("invalid", true);
    show("uploading", false);
  }

  /* 压缩：长边 ≤2000、JPEG 0.85、白底（试卷是白纸，PNG 透明没有意义） */
  function compress(file) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () {
        try {
          var w = img.naturalWidth || 1;
          var h = img.naturalHeight || 1;
          var long = Math.max(w, h);
          var scale = long > MAX_EDGE ? MAX_EDGE / long : 1;
          var cw = Math.max(1, Math.round(w * scale));
          var ch = Math.max(1, Math.round(h * scale));
          var canvas = document.createElement("canvas");
          canvas.width = cw;
          canvas.height = ch;
          var ctx = canvas.getContext("2d");
          ctx.fillStyle = "#ffffff";
          ctx.fillRect(0, 0, cw, ch);
          ctx.drawImage(img, 0, 0, cw, ch);
          var dataUrl = canvas.toDataURL("image/jpeg", QUALITY);
          if (!dataUrl || dataUrl.indexOf("data:image/jpeg") !== 0) {
            reject(new Error("这张照片无法编码"));
            return;
          }
          resolve({ dataUrl: dataUrl });
        } catch (e) {
          reject(e);
        } finally {
          URL.revokeObjectURL(url);
        }
      };
      img.onerror = function () {
        URL.revokeObjectURL(url);
        reject(new Error("这张照片无法读取，请换一张"));
      };
      img.src = url;
    });
  }

  function dataUrlToBlob(dataUrl) {
    var parts = dataUrl.split(",");
    var mime = (parts[0].match(/:(.*?);/) || [])[1] || "image/jpeg";
    var binary = atob(parts[1] || "");
    var bytes = new Uint8Array(binary.length);
    for (var i = 0; i < binary.length; i += 1) bytes[i] = binary.charCodeAt(i);
    return new Blob([bytes], { type: mime });
  }

  function countSent() {
    var sent = 0;
    shots.forEach(function (shot) { if (shot.state === "sent") sent += 1; });
    return sent;
  }

  function render() {
    var sent = countSent();
    el("count").textContent = shots.length
      ? "已传 " + sent + " / " + shots.length + " 张"
      : "还没有照片";
    el("max").textContent = String(MAX_IMAGES);
    el("limit").textContent = "最多 " + MAX_IMAGES + " 张";
    show("shots-card", shots.length > 0);
    var grid = el("shots");
    grid.innerHTML = "";
    shots.forEach(function (shot, index) {
      var box = document.createElement("div");
      box.className = "shot" + (shot.state === "failed" ? " failed" : (shot.state === "sending" ? " sending" : ""));
      var img = document.createElement("img");
      img.src = shot.dataUrl;
      img.alt = "第 " + (index + 1) + " 张";
      var badge = document.createElement("b");
      badge.textContent = shot.state === "sent" ? "✓ " + (index + 1)
        : (shot.state === "failed" ? "! " + (index + 1) : "… " + (index + 1));
      box.appendChild(img);
      box.appendChild(badge);
      grid.appendChild(box);
    });
    var failed = shots.filter(function (shot) { return shot.state === "failed"; }).length;
    el("btn-camera").disabled = shots.length >= MAX_IMAGES || busy;
    el("btn-album").disabled = shots.length >= MAX_IMAGES || busy;
    el("btn-retry").disabled = busy || !failed;
    el("btn-clear").disabled = busy;
    show("sent", sent > 0 && !failed && !busy);
    if (sent > 0 && failed === 0) {
      el("sent").textContent = "已上传 " + sent + " 张";
    }
  }

  /* 一张照片上传一次：服务器只做内存暂存，电脑端随后直接读同一份字节 */
  function upload(shot) {
    shot.state = "sending";
    render();
    return new Promise(function (resolve, reject) {
      var form = new FormData();
      form.append("file", shot.blob, "photo.jpg");
      var xhr = new XMLHttpRequest();
      xhr.open("POST", "/api/ocr/pair/" + encodeURIComponent(token) + "/upload");
      xhr.upload.onprogress = function (e) {
        if (!e.lengthComputable) return;
        el("bar").style.width = String(Math.round((e.loaded / e.total) * 100)) + "%";
      };
      xhr.onload = function () {
        if (xhr.status >= 200 && xhr.status < 300) {
          resolve();
          return;
        }
        var message = "上传失败（HTTP " + xhr.status + "）";
        try {
          var body = JSON.parse(xhr.responseText || "{}");
          if (body && body.detail) message = String(body.detail);
        } catch (e) { /* 保留默认文案 */ }
        reject(new Error(message));
      };
      xhr.onerror = function () { reject(new Error("网络中断，请检查手机网络后重试")); };
      xhr.send(form);
    });
  }

  async function sendOne(shot) {
    try {
      await upload(shot);
      shot.state = "sent";
    } catch (e) {
      shot.state = "failed";
      el("sub").textContent = ((e && e.message) || "上传失败") + "（可以点下面「重试未传成功的」）";
      if (String((e && e.message) || "").indexOf("配对") >= 0) fail(e.message);
    }
    render();
  }

  async function onPick(event) {
    var files = Array.prototype.slice.call((event.target && event.target.files) || []);
    if (event.target) event.target.value = "";
    if (!files.length || busy) return;
    var room = MAX_IMAGES - shots.length;
    if (room <= 0) {
      el("sub").textContent = "已达上限 " + MAX_IMAGES + " 张，请在电脑端操作。";
      return;
    }
    var picked = files.slice(0, room);
    busy = true;
    show("uploading", true);
    el("uploading").textContent = "正在上传，请勿关闭本页…";
    var failed = 0;
    for (var i = 0; i < picked.length; i += 1) {
      try {
        var shot = await compress(picked[i]);
        shot.blob = dataUrlToBlob(shot.dataUrl);
        shot.state = "sending";
        shots.push(shot);
        render();
      } catch (e) {
        failed += 1;
        continue;
      }
      await sendOne(shot);
    }
    busy = false;
    show("uploading", false);
    el("bar").style.width = "0";
    if (failed) {
      el("sub").textContent = failed + " 张照片无法读取，已跳过；HEIC 等格式请先转为 JPG。";
    }
    render();
  }

  async function retryFailed() {
    if (busy) return;
    var targets = shots.filter(function (shot) { return shot.state === "failed"; });
    if (!targets.length) return;
    busy = true;
    show("uploading", true);
    el("uploading").textContent = "正在重传…";
    for (var i = 0; i < targets.length; i += 1) await sendOne(targets[i]);
    busy = false;
    show("uploading", false);
    render();
  }

  /* 「传完了」这个动作已经取消：手机不需要宣布任何事。
     电脑端收到第一张照片就收起配对窗口，之后你拍多少张它就收多少张，
     什么时候开始识别由电脑端决定——所以这里没有、也不该有一个「我拍完了」的按钮。 */

  // ---- 启动：先报到，让电脑端知道手机已连接；顺带取回电脑端当前的配色 ----
  (async function start() {
    if (!token) {
      fail("链接里缺少配对码，请重新扫码。");
      return;
    }
    var info = null;
    try {
      var res = await fetch("/api/ocr/pair/" + encodeURIComponent(token) + "/hello", { method: "POST" });
      if (!res.ok) {
        var body = null;
        try { body = await res.json(); } catch (e) { /* 忽略 */ }
        fail((body && body.detail) || "配对已失效或已过期。");
        return;
      }
      try { info = await res.json(); } catch (e) { info = null; }
    } catch (e) {
      fail("无法连接服务器，请确认手机与电脑在同一网络下。");
      return;
    }
    if (info && typeof window.nbxSetTheme === "function") {
      window.nbxSetTheme(info.theme, info.sky);
    }
    show("loading", false);
    show("main", true);
    render();
  })();

  el("btn-camera").addEventListener("click", function () { el("input-camera").click(); });
  el("btn-album").addEventListener("click", function () { el("input-album").click(); });
  el("input-camera").addEventListener("change", onPick);
  el("input-album").addEventListener("change", onPick);
  el("btn-retry").addEventListener("click", retryFailed);
  el("btn-clear").addEventListener("click", function () {
    // 只清手机上的列表：已经传上去的照片留在电脑端，不在这里删
    if (busy) return;
    shots = [];
    el("bar").style.width = "0";
    el("sub").textContent = "已清空本页列表，已上传的照片不受影响。";
    render();
  });
})();
</script>
</body>
</html>
