# 常规运行时不热重载：UVICORN_RELOAD 由 Dockerfile 默认置为空串。
# 开发模式（docker-compose.dev.yml）把它覆盖成 " --reload …"，于是下面两行
# 会变成带 --reload 的命令。supervisord 要求变量必须已定义，故 Dockerfile 里给了默认值。
#
# --no-dev 必须留着：镜像里 uv sync 用的是 --no-dev，运行时若让 uv run 自动补
# 依赖树，它每次新建容器都会把 dev 组（pytest/pygments…）重新下载一遍——既慢又依赖网络。
[supervisord]
nodaemon=true
user=root

[program:neobangx-main]
command=uv run --no-dev uvicorn app.main:app --host 0.0.0.0 --port 8000%(ENV_UVICORN_RELOAD)s
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:neobangx-admin]
command=uv run --no-dev uvicorn app.admin_main:app --host 0.0.0.0 --port 8001%(ENV_UVICORN_RELOAD)s
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
