[project]
name = "neobangx-backend"
version = "1.1.0"
description = "NeoBangX backend: FastAPI + LiteLLM + SQLite usage codes"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic-settings>=2.7.0",
    "litellm>=1.59.0",
    "sse-starlette>=2.2.0",
    "sqlalchemy>=2.0.36",
    "pyjwt>=2.10.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.28.0",
]
